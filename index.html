<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="image"
      href="/images/interior-960.webp"
      imagesrcset="/images/interior-480.webp 480w, /images/interior-960.webp 960w, /images/interior-1400.webp 1400w"
      imagesizes="(max-width: 600px) 90vw, (max-width: 900px) 80vw, 700px"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1330" />
    <title>Blue Hawke — Design & development studio</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: grid;
        place-items: center;
        margin: 0;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        background: radial-gradient(
          circle at 50% 40%,
          #12224a 0%,
          #0a1330 55%,
          #060b1f 100%
        );
        color: #cfe3ff;
        color-scheme: dark;
        transition:
          opacity 0.55s ease,
          visibility 0.55s ease;
      }
      #boot-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-loader .loader {
        position: relative;
        width: min(320px, 72vw);
        aspect-ratio: 1;
      }
      #boot-loader .ring,
      #boot-loader .spin,
      #boot-loader .trail {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }
      #boot-loader .ring {
        border: 2px solid rgba(120, 170, 255, 0.2);
        box-shadow:
          inset 0 0 30px rgba(56, 130, 246, 0.12),
          0 0 30px rgba(56, 130, 246, 0.1);
      }
      #boot-loader .spin {
        animation: boot-orbit 2s linear infinite;
      }
      #boot-loader .trail {
        background: conic-gradient(
          from 0deg,
          transparent 0 70%,
          rgba(255, 255, 255, 0.9) 100%
        );
        -webkit-mask: radial-gradient(
          circle,
          transparent calc(50% - 3px),
          #000 calc(50% - 2px),
          #000 50%,
          transparent calc(50% + 1px)
        );
        mask: radial-gradient(
          circle,
          transparent calc(50% - 3px),
          #000 calc(50% - 2px),
          #000 50%,
          transparent calc(50% + 1px)
        );
      }
      #boot-loader .led {
        position: absolute;
        left: 50%;
        top: -4px;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        border-radius: 50%;
        background: #fff;
        box-shadow:
          0 0 6px 2px #fff,
          0 0 16px 6px rgba(160, 200, 255, 0.9),
          0 0 32px 12px rgba(56, 130, 246, 0.6);
      }
      #boot-loader .bird {
        position: absolute;
        left: 14%;
        top: 50%;
        width: 72%;
        transform: translateY(-50%);
        overflow: visible;
      }
      #boot-loader .glow {
        filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
      }
      @keyframes boot-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader .spin {
          animation-duration: 6s;
        }
        #boot-loader {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" role="status" aria-busy="true" aria-label="Loading Blue Hawke">
      <div class="loader" aria-hidden="true">
        <div class="ring"></div>
        <div class="spin"><div class="trail"></div><div class="led"></div></div>
        <svg class="bird" viewBox="0 0 70.4 46.9">
          <defs>
            <path
              id="eagle"
              fill-rule="evenodd"
              d="M5.9 17.4 L5.9 18.4 L8.0 21.1 L14.4 26.9 L18.9 29.4 L26.5 32.6 L25.6 33.2 L22.6 33.4 L15.4 32.1 L15.4 33.1 L17.5 34.9 L24.9 38.8 L27.2 45.4 L28.1 46.8 L29.1 46.8 L32.1 39.6 L37.8 30.9 L37.9 29.5 L26.9 27.0 L14.1 21.8 L6.9 17.4Z M0.0 0.0 L0.0 1.0 L5.9 9.0 L12.4 14.8 L16.9 17.6 L23.4 20.9 L30.8 23.4 L46.8 26.5 L46.6 27.2 L43.4 30.6 L38.1 37.9 L35.6 42.2 L35.6 43.2 L36.9 43.1 L42.6 38.4 L47.5 35.1 L57.1 30.2 L59.6 29.5 L64.8 29.4 L67.4 30.4 L68.2 32.0 L69.2 32.0 L69.9 31.2 L70.2 28.6 L69.1 26.1 L65.5 23.0 L63.8 20.2 L61.1 18.4 L57.2 16.9 L49.1 15.2 L37.8 14.9 L33.5 14.0 L20.9 9.8 L10.1 4.9 L1.1 0.0Z M54.0 20.4 L56.5 20.0 L60.6 21.0 L62.8 22.1 L64.4 24.0 L62.0 23.4 L57.5 24.0Z"
            />
          </defs>
          <g class="glow"><use href="#eagle" fill="#fff" /></g>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
